<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3e8">
  <title>鹈鹕的海岸骑行 · A Little Ride</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3e8;
      --ink: #2d493e;
      --muted: #7d897b;
      --line: #dedfd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 36px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .page { width: min(1320px, 100%); margin: 0 auto; }
    .masthead {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 38px; height: 38px; }
    .brand-name { font-size: 15px; font-weight: 650; letter-spacing: 2px; }
    .brand-name small { display: block; margin-top: 5px; font-size: 9px; letter-spacing: 3px; font-weight: 500; }
    .edition { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
    .scene-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #eef2e3;
    }
    .story { position: absolute; z-index: 1; top: 35px; left: 42px; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 16px; font-size: 10px; letter-spacing: 3px; }
    .eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(28px, 4.4vw, 57px);
      line-height: 1.27;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .story-note { margin: 17px 0 0; font-size: 12px; color: #748777; letter-spacing: 1px; }
    .weather {
      position: absolute;
      right: 39px;
      top: 35px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .weather svg { width: 28px; height: 28px; }
    .weather small { display: block; font-size: 9px; margin-top: 4px; letter-spacing: 2px; color: #859182; }
    #coast { display: block; width: 100%; height: auto; }
    .sky { fill: #edf2e3; }
    .sea { fill: #bddbd2; }
    .sea-line { stroke: #90c1b6; }
    .hill-far { fill: #bcccb3; }
    .hill-near { fill: #ced5b6; }
    .sand { fill: #e8ddbb; }
    .road { fill: #f0e9cf; }
    .cloud { fill: #fffef7; }
    .sun { fill: #efc966; }
    .sun-halo { stroke: #e7dca0; }
    .sky, .sea, .hill-far, .hill-near, .sand, .road, .cloud, .sun {
      transition: fill 1.2s ease;
    }
    .dusk .sky { fill: #f4d7be; }
    .dusk .sea { fill: #b9c9cb; }
    .dusk .sea-line { stroke: #91aeb6; }
    .dusk .hill-far { fill: #b8b6a3; }
    .dusk .hill-near { fill: #c9bca1; }
    .dusk .sand { fill: #dfcaa6; }
    .dusk .road { fill: #e9d7b8; }
    .dusk .cloud { fill: #fff0dd; }
    .dusk .sun { fill: #e99160; }
    .dusk .sun-halo { stroke: #edba91; }
    .dusk .story-note, .dusk .weather small { color: #8c806d; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
    .scene-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 23px 3px 24px;
    }
    .caption { display: flex; gap: 14px; align-items: center; }
    .caption-line { width: 27px; height: 1px; background: #a7b3a3; }
    .caption p { margin: 0; font-size: 12px; letter-spacing: 1px; }
    .caption small { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; letter-spacing: 1px; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      min-height: 42px;
      border: 1px solid #d3d9cb;
      border-radius: 24px;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .control:hover { background: #e6ebdd; border-color: #a5b39f; }
    .control:active { transform: scale(.97); }
    .control:focus-visible { outline: 2px solid #2e8176; outline-offset: 4px; }
    .control.primary { background: #2f5044; border-color: #2f5044; color: #f9f8ed; }
    .control.primary:hover { background: #3e6656; }
    .control svg { width: 15px; height: 15px; flex: none; }
    .colophon {
      display: flex;
      justify-content: space-between;
      padding: 16px 0 25px;
      border-top: 1px solid var(--line);
      font-size: 9px;
      letter-spacing: 2px;
      color: #8b9385;
    }
    @media (min-width: 1600px) { .masthead { height: 110px; } }
    @media (max-width: 700px) {
      body { padding: 0 17px; }
      .masthead { height: 77px; }
      .brand-name { font-size: 12px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .scene-card { border-radius: 17px; }
      .story { top: 24px; left: 23px; }
      .eyebrow { font-size: 8px; margin-bottom: 11px; letter-spacing: 2px; }
      h1 { font-size: 34px; }
      .story-note { font-size: 10px; margin-top: 11px; }
      .weather { top: 25px; right: 22px; font-size: 10px; gap: 6px; }
      .weather svg { width: 23px; height: 23px; }
      .weather small { font-size: 7px; letter-spacing: 1px; }
      #coast { width: 155%; max-width: none; margin-left: -29%; padding-top: 120px; }
      .scene-footer { align-items: flex-start; padding-top: 21px; flex-direction: column; gap: 20px; }
      .controls { width: 100%; }
      .control { flex: 1; padding: 11px 10px; }
      .colophon { font-size: 8px; letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="21" cy="21" r="20" stroke="#c5cebc"/>
          <path d="M11 27h15M14 25c-3-7 0-10 4-10 3 0 4 3 4 5l9 1-9 3c-3 5-7 4-8 1Z" stroke-width="1.6"/>
          <path d="M16 26v4m5-4v4m-7 0h4m1 0h4" stroke-width="1.6"/>
          <circle cx="20" cy="17" r=".9" fill="currentColor" stroke="none"/>

        <div class="brand-name">慢慢骑行社<small>THE LITTLE RIDE CLUB</small></div>
      </div>
      <span class="edition">VOL. 01 &nbsp; / &nbsp; 海岸来信</span>
    </header>

    <main>
      <section class="scene-card" aria-label="鹈鹕骑自行车的海岸动画">
        <div class="story">
          <p class="eyebrow">今天的目的地：好心情</p>
          <h1>把日子，<br>骑慢一点。</h1>

                <circle cx="619" cy="200" r="7.5" fill="#3b5147"/>
                <circle cx="621" cy="197.5" r="2.3" fill="#fffdf0"/>
                <path d="M610 186q7-5 14 0" fill="none" stroke="#3f594b" stroke-width="2.5"/>
                <path d="M605 217q-5 5-10 1" fill="none" stroke="#c1cbb4" stroke-width="2"/>

                <!-- A tiny cycling cap, with its ribbon lifted by the breeze. -->
                <path d="M571 179C578 154 598 145 619 153 631 157 638 168 638 179Z" fill="#629fa9" stroke="#385e5a" stroke-width="3"/>
                <path d="M602 151q-5 15 1 28" fill="none" stroke="#9cc5bc" stroke-width="4"/>
                <path d="M568 178q37-7 76 0 16 3 17 9-24 5-45-3l-47 4Z" fill="#46848b" stroke="#385e5a" stroke-width="3"/>
                <path d="M569 182 558 188" stroke="#385e5a" stroke-width="3"/>
                <circle cx="602" cy="150" r="3" fill="#385e5a"/>
              </g>

              <g id="near-leg" fill="none">
                <path id="near-leg-outline" d="M555 362 641 421 632 486" stroke="#806345" stroke-width="13"/>
                <path id="near-leg-color" d="M555 362 641 421 632 486" stroke="#eab76c" stroke-width="8"/>
                <circle id="near-knee" cx="641" cy="421" r="5" fill="#eab76c"/>
                <g id="near-foot" transform="translate(632 486)">
                  <path d="M-10-7Q1-12 10-4L25 4Q29 10 19 10H-12Z" fill="#eab76c" stroke="#806345" stroke-width="2.5"/>
                  <path d="M6 1 20 6M0 4l13 4" stroke="#c38e4f" stroke-width="1.5"/>
                </g>
              </g>
              <g id="near-pedal" transform="translate(632 493)">
                <path d="M-13 0H13" stroke="#3e5145" stroke-width="6"/>
                <path d="M-8-1H8" stroke="#b5c7a9" stroke-width="1.5"/>
              </g>
            </g>

            <g id="foreground-track" opacity=".85">
              <g id="foreground-plants">
                <path d="M27 690q2-39-16-61m16 61q11-53 37-74m-37 74q-26-27-42-23" fill="none" stroke="#9ca67b" stroke-width="4"/>
                <path d="M1081 690q8-35 29-49m-29 49q-7-43-23-55m23 55q24-18 48-18" fill="none" stroke="#9ca67b" stroke-width="4"/>
                <use href="#flower" x="1137" y="698" transform="rotate(-8 1137 698) scale(1.1)"/>
                <path d="M799 679h37m-576-4h52" stroke="#cabc96" stroke-width="2" stroke-linecap="round"/>
              </g>
              <use href="#foreground-plants" x="1200"/>
            </g>
          </g>
        </svg>
      </section>

      <div class="scene-footer">
        <div class="caption">
          <span class="caption-line" aria-hidden="true"></span>
          <p>一路向前，慢慢也很好。<small>NOWHERE TO HURRY. EVERYWHERE TO GO.</small></p>
        </div>
        <div class="controls" aria-label="动画控制">
          <button class="control" id="weather-toggle" type="button" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 13h14M5 16h10M6 10a4 4 0 0 1 8 0M10 2v2M3 6l2 1m12-1-2 1"/></svg>
            <span id="weather-button-label">看看日落</span>
          </button>
          <button class="control primary" id="play-toggle" type="button" aria-pressed="false" aria-label="暂停动画">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M6 4h3v12H6Zm5 0h3v12h-3Z"/></svg>
            <span id="play-label">休息一下</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="colophon"><span>一个关于海风的小小白日梦</span><span>MADE OF SIMPLE, HAPPY THINGS.</span></footer>
  </div>

  <script>
    (() => {
      'use strict';

      // One clock drives the wheels, crank, inverse-kinematic legs and scenery.
      // Nothing is fetched: this document also runs directly from a local file.
      const byId = id => document.getElementById(id);
      const svg = byId('coast');
      const elements = Object.fromEntries([
        'rider-and-bike', 'bike-shadow', 'rear-spokes', 'front-spokes', 'crank',
        'near-pedal', 'far-pedal', 'near-leg-outline', 'near-leg-color',
        'far-leg-outline', 'far-leg-color', 'near-knee', 'near-foot', 'far-foot',
        'road-track', 'foreground-track', 'scarf-tail', 'wind-lines',
        'cloud-1', 'cloud-2', 'cloud-3', 'cloud-4', 'gull-1', 'gull-2', 'gull-3',
        'wave-1', 'wave-2', 'sun-group'
      ].map(id => [id, byId(id)]));

      const circumference = 2 * Math.PI * 95;
      const cadence = 2 * Math.PI / 1.55;
      const velocity = circumference / 3.1;
      const wrap = (value, length) => ((value % length) + length) % length;
      let time = 0;
      let playing = true;
      let lastFrame = null;
      let frameRequest = null;
      let dusk = false;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function setTransform(id, value) {
        elements[id].setAttribute('transform', value);
      }

      function drawLeg(side, phase) {
        const hip = side === 'near' ? { x: 553, y: 361 } : { x: 546, y: 358 };
        const pedal = { x: 597 + Math.cos(phase) * 35, y: 493 + Math.sin(phase) * 35 };
        const ankle = { x: pedal.x - 5, y: pedal.y - 9 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upperLength = 96;
        const lowerLength = 94;
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const knee = {
          x: hip.x + along * dx / distance + height * dy / distance,
          y: hip.y + along * dy / distance - height * dx / distance
        };
        const path = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`;
        elements[`${side}-leg-outline`].setAttribute('d', path);
        elements[`${side}-leg-color`].setAttribute('d', path);
        setTransform(`${side}-foot`, `translate(${pedal.x - 4} ${pedal.y - 10})`);
        setTransform(`${side}-pedal`, `translate(${pedal.x} ${pedal.y})`);
        if (side === 'near') {
          elements['near-knee'].setAttribute('cx', knee.x);
          elements['near-knee'].setAttribute('cy', knee.y);
        }
      }

      function render(t) {
        const phase = t * cadence;
        const roll = t * velocity / circumference * 360;
        const bob = Math.sin(phase * 2) * 1.8;
        setTransform('rider-and-bike', `translate(0 ${bob})`);
        setTransform('rear-spokes', `rotate(${roll})`);
        setTransform('front-spokes', `rotate(${roll})`);
        setTransform('crank', `translate(597 493) rotate(${phase * 180 / Math.PI})`);
        drawLeg('far', phase + Math.PI);
        drawLeg('near', phase);
        setTransform('scarf-tail', `translate(587 281) rotate(${Math.sin(t * 5.2) * 5 - 3}) scale(1 ${1 + Math.sin(t * 4) * .07})`);
        elements['bike-shadow'].setAttribute('rx', 227 + bob * 1.5);
        setTransform('road-track', `translate(${-wrap(t * velocity, 1200)} 0)`);
        setTransform('foreground-track', `translate(${-wrap(t * velocity * 1.35, 1200)} 0)`);
        setTransform('cloud-1', `translate(${wrap(430 - t * 9, 1390) - 40} 115) scale(.9)`);
        setTransform('cloud-2', `translate(${wrap(1070 - t * 13, 1390) - 40} 257) scale(.85)`);
        setTransform('cloud-3', `translate(${wrap(150 - t * 7, 1390) - 40} 310) scale(.65)`);
        setTransform('cloud-4', `translate(${wrap(750 - t * 6, 1390) - 40} 95) scale(.5)`);
        for (let i = 1; i <= 3; i++) {
          const x = [0, 821, 865, 955][i];
          const y = [0, 273, 254, 309][i];
          const scale = [0, .75, .55, .6][i];
          setTransform(`gull-${i}`, `translate(${x + Math.sin(t * .3 + i) * 24} ${y + Math.sin(t * 1.1 + i) * 5}) scale(${scale} ${scale * (1 + Math.sin(t * 3 + i) * .16)})`);
        }
        setTransform('wave-1', `translate(${Math.sin(t * .6) * 14} 0)`);
        setTransform('wave-2', `translate(${Math.sin(t * .6 + 2) * 10} 0)`);
        elements['wind-lines'].setAttribute('opacity', .45 + Math.sin(t * 2.3) * .17);
      }

      function animate(now) {
        if (!playing) return;
        if (lastFrame !== null) time += (now - lastFrame) / 1000;
        lastFrame = now;
        render(time);
        frameRequest = requestAnimationFrame(animate);
      }

      function setPlaying(value) {
        playing = value;
        byId('play-label').textContent = playing ? '休息一下' : '继续兜风';
        byId('play-icon').setAttribute('d', playing ? 'M6 4h3v12H6Zm5 0h3v12h-3Z' : 'M6 3 16 10 6 17Z');
        byId('play-toggle').setAttribute('aria-pressed', String(!playing));
        byId('play-toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        lastFrame = null;
        if (frameRequest !== null) cancelAnimationFrame(frameRequest);
        frameRequest = playing && !reducedMotion ? requestAnimationFrame(animate) : null;
      }

      byId('play-toggle').addEventListener('click', () => {
        if (!reducedMotion) setPlaying(!playing);
      });
      byId('weather-toggle').addEventListener('click', () => {
        dusk = !dusk;
        document.body.classList.toggle('dusk', dusk);
        byId('weather-toggle').setAttribute('aria-pressed', String(dusk));
        byId('weather-button-label').textContent = dusk ? '回到晴天' : '看看日落';
        byId('weather-label').textContent = dusk ? '暮 · 晚风' : '晴 · 微风';
        byId('weather-note').textContent = dusk ? 'THE GOLDEN HOUR' : 'A LOVELY DAY';
      });

      document.addEventListener('visibilitychange', () => { lastFrame = null; });

      // ?t=2.5 displays an exact still frame without changing the document.
      const requestedTime = new URLSearchParams(location.search).get('t');
      if (requestedTime !== null && Number.isFinite(Number(requestedTime))) {
        time = Number(requestedTime);
        render(time);
        setPlaying(false);
      } else {
        render(0);
        setPlaying(!reducedMotion);
      }
      window.__ready = true;
    })();
  </script>
</body>
</html>
