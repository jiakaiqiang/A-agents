[project]
name = "mewcode"
version = "0.1.0"
description = "A terminal multi-provider LLM chat client"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.80",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
